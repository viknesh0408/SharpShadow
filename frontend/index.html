<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SharpShadow — Premium PSD Marketplace</title>
    <meta name="description" content="Discover premium editable Photoshop PSD templates, flyers, mockups, social media graphics, and creative assets built to elevate your designs." />
    
    <!-- OpenGraph / Social Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SharpShadow — Premium PSD Marketplace" />
    <meta property="og:description" content="Download high-resolution, layered PSD templates and graphic assets crafted for creative professionals." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:site_name" content="SharpShadow" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Theme Initialization (Prevents FOUC) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('sharpshadow_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>
    
    <!-- Razorpay Checkout SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
