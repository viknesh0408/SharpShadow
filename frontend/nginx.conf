server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    client_max_body_size 500M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # API Proxy to live Railway backend
    location /api/ {
        client_max_body_size 500M;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass https://backend-production-3d6a.up.railway.app/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host backend-production-3d6a.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded image previews
    location /uploads/ {
        proxy_pass https://backend-production-3d6a.up.railway.app/uploads/;
        proxy_ssl_server_name on;
        proxy_set_header Host backend-production-3d6a.up.railway.app;
    }

    # React SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
