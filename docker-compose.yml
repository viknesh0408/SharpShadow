version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: sharpshadow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sharpshadow
      MYSQL_USER: sharpshadow_user
      MYSQL_PASSWORD: sharpshadow_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sharpshadow-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sharpshadow-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_URL: jdbc:mysql://mysql:3306/sharpshadow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: sharpshadow_user
      DB_PASSWORD: sharpshadow_pass
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_sharpshadow_key}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-rzp_test_sharpshadow_secret}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-whsec_sharpshadow_secret}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8080:8080"
    volumes:
      - backend_storage:/app/storage
    networks:
      - sharpshadow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sharpshadow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - sharpshadow-network

networks:
  sharpshadow-network:
    driver: bridge

volumes:
  mysql_data:
  backend_storage:
