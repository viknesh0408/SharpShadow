server:
  port: ${PORT:8085}
  servlet:
    context-path: /
  tomcat:
    max-swallow-size: 1500MB
    max-http-form-post-size: 1500MB

spring:
  application:
    name: sharpshadow-marketplace
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 1500MB
      max-request-size: 1500MB
      enabled: true
  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        hbm2ddl.auto: update
  # Spring Mail SMTP — set MAIL_USERNAME + MAIL_PASSWORD in Railway to activate
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    test-connection: false   # <-- never block startup by testing SMTP at boot
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

sharpshadow:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    currency: INR
  admin:
    email: ${ADMIN_EMAIL:admin@sharpshadow.com}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:SharpShadows Administrator}
  storage:
    type: ${STORAGE_TYPE:local} # local, r2, or s3
    signing-secret: ${DOWNLOAD_SIGNING_SECRET:${JWT_SECRET:}}
    url-expiry-minutes: ${STORAGE_URL_EXPIRY_MINUTES:60}
    local:
      upload-dir: ${STORAGE_LOCAL_DIR:./storage/uploads}
      private-dir: ${STORAGE_PRIVATE_DIR:./storage/private}
    r2:
      account-id: ${R2_ACCOUNT_ID:${STORAGE_ACCOUNT_ID:}}
      endpoint: ${R2_ENDPOINT:${STORAGE_ENDPOINT:}}
      access-key-id: ${R2_ACCESS_KEY_ID:${STORAGE_ACCESS_KEY:}}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:${STORAGE_SECRET_KEY:}}
      bucket: ${R2_BUCKET_NAME:${STORAGE_BUCKET:sharpshadow-assets}}
      public-url: ${R2_PUBLIC_URL:${STORAGE_PUBLIC_URL:}}
      region: ${R2_REGION:${STORAGE_REGION:auto}}
    s3:
      endpoint: ${STORAGE_ENDPOINT:https://s3.amazonaws.com}
      access-key: ${STORAGE_ACCESS_KEY:test_access_key}
      secret-key: ${STORAGE_SECRET_KEY:test_secret_key}
      bucket: ${STORAGE_BUCKET:sharpshadow-psds}
      region: ${STORAGE_REGION:ap-south-1}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173,https://*.up.railway.app,https://*.vercel.app}
  mail:
    from: ${MAIL_FROM:noreply@sharpshadow.com}
    brevo-api-key: ${BREVO_API_KEY:}
    resend-api-key: ${RESEND_API_KEY:}
  app:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}

---
# Dev Profile (Default zero-config with H2 file/memory support)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./storage/data/sharpshadowdb;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: false
      path: /h2-console

---
# MySQL / Production Profile
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:sharpshadow}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:${MYSQLUSER:root}}
    password: ${DB_PASSWORD:${MYSQLPASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

---
# PostgreSQL / Production Profile
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:railway}}
    username: ${DB_USERNAME:${PGUSER:postgres}}
    password: ${DB_PASSWORD:${PGPASSWORD:}}
    driver-class-name: org.postgresql.Driver
  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        hbm2ddl.auto: update
        default_schema: public


