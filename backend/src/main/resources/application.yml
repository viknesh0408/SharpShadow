server:
  port: ${PORT:8085}
  servlet:
    context-path: /
  tomcat:
    max-swallow-size: 500MB
    max-http-form-post-size: 500MB

spring:
  application:
    name: sharpshadow-marketplace
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
      enabled: true
  # Spring Mail SMTP — set MAIL_USERNAME + MAIL_PASSWORD in Railway to activate
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    test-connection: false   # <-- never block startup by testing SMTP at boot
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

sharpshadow:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    currency: INR
  admin:
    email: ${ADMIN_EMAIL:admin@sharpshadow.com}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:SharpShadow Administrator}
  storage:
    type: ${STORAGE_TYPE:local} # local or s3
    signing-secret: ${DOWNLOAD_SIGNING_SECRET:${JWT_SECRET}}
    local:
      upload-dir: ${STORAGE_LOCAL_DIR:./storage/uploads}
      private-dir: ${STORAGE_PRIVATE_DIR:./storage/private}
    s3:
      endpoint: ${STORAGE_ENDPOINT:https://s3.amazonaws.com}
      access-key: ${STORAGE_ACCESS_KEY:test_access_key}
      secret-key: ${STORAGE_SECRET_KEY:test_secret_key}
      bucket: ${STORAGE_BUCKET:sharpshadow-psds}
      region: ${STORAGE_REGION:ap-south-1}
    url-expiry-minutes: 60
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173,https://*.up.railway.app,https://*.vercel.app}
  mail:
    from: ${MAIL_FROM:noreply@sharpshadow.com}
    brevo-api-key: ${BREVO_API_KEY:}
    resend-api-key: ${RESEND_API_KEY:}
  app:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}

---
# Dev Profile (Default zero-config with H2 file/memory support)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./storage/data/sharpshadowdb;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

sharpshadow:
  jwt:
    secret: ${JWT_SECRET:c816d4715b28e5bd9d9fd711911574b08d5da0eb4ffa5059be3fd6fc4109b87b}
  storage:
    signing-secret: ${DOWNLOAD_SIGNING_SECRET:ec8d6de3ef72a993b8f4731e1802be6f7903e93806d292e00982a08b452669e3}
  admin:
    password: ${ADMIN_PASSWORD:DevAdmin#2026!Secured}

---
# MySQL / Production Profile
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:sharpshadow}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:${MYSQLUSER:root}}
    password: ${DB_PASSWORD:${MYSQLPASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
