server:
  port: ${PORT:8085}
  servlet:
    context-path: /

spring:
  application:
    name: sharpshadow-marketplace
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
      enabled: true

sharpshadow:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_sharpshadow_key}
    key-secret: ${RAZORPAY_KEY_SECRET:rzp_test_sharpshadow_secret}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:whsec_sharpshadow_secret}
    currency: INR
  storage:
    type: ${STORAGE_TYPE:local} # local or s3
    local:
      upload-dir: ${STORAGE_LOCAL_DIR:./storage/uploads}
      private-dir: ${STORAGE_PRIVATE_DIR:./storage/private}
    s3:
      endpoint: ${STORAGE_ENDPOINT:https://s3.amazonaws.com}
      access-key: ${STORAGE_ACCESS_KEY:test_access_key}
      secret-key: ${STORAGE_SECRET_KEY:test_secret_key}
      bucket: ${STORAGE_BUCKET:sharpshadow-psds}
      region: ${STORAGE_REGION:ap-south-1}
    url-expiry-minutes: 60
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

---
# Dev Profile (Default zero-config with H2 file/memory support)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./storage/data/sharpshadowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

---
# MySQL / Production Profile
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sharpshadow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
